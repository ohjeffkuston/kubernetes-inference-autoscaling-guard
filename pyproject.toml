[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kubernetes-inference-autoscaling-guard"
version = "0.1.0"
description = "Deterministic GitOps guard for Kubernetes AI inference autoscaling"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
inference-autoscaling-guard = "inference_autoscaling_guard.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
